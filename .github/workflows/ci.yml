name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      OSV_VERSION: 2.6.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Instalar gitleaks y osv-scanner (versiones fijas)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          curl -sSfL -o /usr/local/bin/osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
      - run: npm test
      - name: Secretos en el historial del kit
        run: gitleaks git . --redact --no-banner
      - name: Dependencias del kit
        run: osv-scanner scan source -r . --lockfile package-lock.json || (echo "osv-scanner encontró vulnerabilidades" && exit 1)
      - name: Plugin válido y paquete publicable
        run: |
          npm pack --dry-run
          node cli/ui-audit.mjs --help
