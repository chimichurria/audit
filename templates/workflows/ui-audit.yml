# Plantilla para PROYECTOS auditados: copiar a .github/workflows/ui-audit.yml.
# Mide la UI contra el preview de Vercel del PR (o un dev server local) y sube el reporte como artefacto.
name: ui-audit
on:
  pull_request:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx -y playwright@1.64.0 install --with-deps chromium webkit
      # Opción A: dev server local. Opción B: AUDIT_BASE_URL con la URL del preview (y el bypass como secreto).
      - run: npm run build && (npm run start &) && npx -y wait-on@8 http://localhost:3000
      - run: npx -y @chimichurria/audit@0.2.1 ui --tag ci
        env:
          AUDIT_BASE_URL: http://localhost:3000
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: ui-audit, path: .ui-audit/ci, retention-days: 14 }
